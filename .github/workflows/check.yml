name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.12"

      - name: Sync the lockfile
        run: uv sync --locked --group dev

      - name: Ruff
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests

      - name: Unit tests
        run: PYTHONPATH=src .venv/bin/python -m unittest discover -s tests

      - name: Build and install the immutable engine release
        run: |
          set -eu
          artifact_dir="$RUNNER_TEMP/engine-artifact"
          host_root="$RUNNER_TEMP/rookrunner-host"
          .venv/bin/python scripts/engine-release.py build --output-dir "$artifact_dir"
          artifact=$(find "$artifact_dir" -maxdepth 1 -type f -name 'rookrunner-engine-*.tar.gz' -print -quit)
          test -n "$artifact"
          .venv/bin/python scripts/engine-release.py install "$artifact" --root "$host_root"
          .venv/bin/python scripts/engine-release.py install "$artifact" --root "$host_root"
          .venv/bin/python scripts/engine-release.py activate "$GITHUB_SHA" --root "$host_root"
          echo "ROOKRUNNER_RELEASE_ROOT=$host_root" >> "$GITHUB_ENV"

      - name: Run the installed engine canary against pre-d8 state
        env:
          ROOKRUNNER_CANARY_IMAGE: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          ROOKRUNNER_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          docker pull "$ROOKRUNNER_CANARY_IMAGE"
          PYTHONPATH="$ROOKRUNNER_RELEASE_ROOT/engine/src:$PWD/tests" \
            .venv/bin/python -m unittest test_engine_release_canary -v
