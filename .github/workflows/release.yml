name: release

on:
  push:
    tags:
      - v0.1.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify the tag signature
        run: sh .github/verify-tag.sh "$GITHUB_REF_NAME"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: false

      - name: Build the wheel and the tarball
        run: uv build --out-dir dist

      - name: Write SHA256SUMS
        run: |
          set -eu
          cd dist
          sha256sum \
            execution_core-0.1.0-py3-none-any.whl \
            execution_core-0.1.0.tar.gz \
            > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify the tag signature
        run: sh .github/verify-tag.sh "$GITHUB_REF_NAME"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: false

      - name: Build the wheel and the tarball
        run: uv build --out-dir dist

      - name: Write SHA256SUMS
        run: |
          set -eu
          cd dist
          sha256sum \
            execution_core-0.1.0-py3-none-any.whl \
            execution_core-0.1.0.tar.gz \
            > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(wc -l < dist/SHA256SUMS)" -eq 2
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "v0.1.0 preview" \
            --notes-file .github/v0.1.0-release-notes.md \
            dist/execution_core-0.1.0-py3-none-any.whl \
            dist/execution_core-0.1.0.tar.gz \
            dist/SHA256SUMS
