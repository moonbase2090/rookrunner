name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Verify the tag signature
        run: sh .github/verify-tag.sh "$GITHUB_REF_NAME"

      - name: Check the tag matches the package version
        run: sh .github/release-version.sh

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: false

      - name: Build the wheel and the tarball
        run: uv build --out-dir dist

      - name: Write SHA256SUMS
        run: |
          set -eu
          cd dist
          sha256sum \
            "$RELEASE_WHEEL" \
            "$RELEASE_SDIST" \
            > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Verify the tag signature
        run: sh .github/verify-tag.sh "$GITHUB_REF_NAME"

      - name: Check the tag matches the package version
        run: sh .github/release-version.sh

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: false

      - name: Build the wheel and the tarball
        run: uv build --out-dir dist

      - name: Write SHA256SUMS
        run: |
          set -eu
          cd dist
          sha256sum \
            "$RELEASE_WHEEL" \
            "$RELEASE_SDIST" \
            > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(wc -l < dist/SHA256SUMS)" -eq 2
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES" \
            "dist/$RELEASE_WHEEL" \
            "dist/$RELEASE_SDIST" \
            dist/SHA256SUMS
