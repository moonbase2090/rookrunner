[project]
name = "execution-core"
version = "0.0.1"
description = "Local execution contract prototype for Rookrunner"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["jsonschema==4.25.1", "ruff==0.12.12"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["ERA", "PGH", "RUF", "B", "UP", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/execution_core/cli.py" = ["T20"]
