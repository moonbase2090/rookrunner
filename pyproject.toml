[project]
name = "execution-core"
version = "0.1.1"
description = "Local execution contract prototype for Rookrunner"
license = "MPL-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["jsonschema==4.25.1", "ruff==0.12.12"]

[dependency-groups]
dev = ["jsonschema==4.25.1", "ruff==0.12.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ERA", "PGH", "RUF", "B", "UP", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/execution_core/cli.py" = ["T20"]
